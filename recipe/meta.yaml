{% set name = "pytest-asyncio" %}
{% set version = "1.4.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: c6c0d2259945122819f171a32ecea2c349ead889ee28176caaf492143424be42

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=77
    - setuptools_scm >=6.2
  run:
    - python
    - backports-asyncio-runner >=1.1,<2  # [py<311]
    - pytest >=8.4,<10
    - typing-extensions >=4.12  # [py<313]


# E   AssertionError: assert {'passed': 2, 'skipped': 0, 'failed': 0, 'errors': 0, 'xpassed': 0, 'xfailed': 0, 'warnings': 5} == {'passed': 2, 'skipped': 0, 'failed': 0, 'errors': 0, 'xpassed': 0, 'xfailed': 0, 'warnings': 4}
{% set deselect_tests = " --deselect=tests/markers/test_class_scope.py::test_asyncio_mark_respects_the_loop_policy" %}

test:
  source_files:
    - tests
    - pyproject.toml
  imports:
    - pytest_asyncio
  requires:
    - pip
    - anyio
    - hypothesis >=5.7.1
  commands:
    - pip check
    - python -c "import pytest_asyncio; assert pytest_asyncio.__version__ == '{{ version }}'"
    - pytest -vv {{ deselect_tests }} # [not win]
    - pytest --asyncio-mode=auto -v {{ deselect_tests }}  # [win]

about:
  home: https://github.com/pytest-dev/pytest-asyncio
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Pytest support for asyncio
  description: |
    pytest-asyncio is a pytest plugin.
    It facilitates testing of code that uses the asyncio library.
  doc_url: https://pytest-asyncio.readthedocs.io
  dev_url: https://github.com/pytest-dev/pytest-asyncio

extra:
  recipe-maintainers:
    - sodre
