{% set name = "pytest-asyncio" %}
{% set version = "1.5.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 92c8fa83ca419fd0d4bd6a34df6520dae435841d3733c319343249492adf37f7

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=77
    - setuptools_scm >=6.2
    - tomli >=1  # [py<311]
  run:
    - python
    - backports-asyncio-runner >=1.1,<2  # [py<311]
    - pytest >=8.4
    - typing-extensions >=4.12  # [py<313]

test:
  source_files:
    - tests
    - pyproject.toml
  imports:
    - pytest_asyncio
  requires:
    - pip
    - anyio
    - hypothesis >=5.7.1
  commands:
    - pip check
    - python -c "import pytest_asyncio; assert pytest_asyncio.__version__ == '{{ version }}'"
    - pytest -vv  # [not win]
    - pytest --asyncio-mode=auto -vv  # [win]

about:
  home: https://github.com/pytest-dev/pytest-asyncio
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Pytest support for asyncio
  description: |
    pytest-asyncio is a pytest plugin.
    It facilitates testing of code that uses the asyncio library.
  doc_url: https://pytest-asyncio.readthedocs.io
  dev_url: https://github.com/pytest-dev/pytest-asyncio

extra:
  recipe-maintainers:
    - sodre
